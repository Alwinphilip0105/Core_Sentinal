[project]
name = "core-sentinel-guardrail"
version = "0.1.0"
requires-python = ">=3.9,<4"

[tool.uv]
package = false

[tool.poetry]
name = "core-sentinel-guardrail"
version = "0.1.0"
description = "Core Sentinel Guardrail project"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "core_sentinel_guardrail", from = "src" }]

[tool.poetry.dependencies]
python = "^3.9"
datasets = "*"
transformers = "*"
torch = ">=2.6"
torchvision = ">=0.19"
accelerate = "*"
pyperclip = "*"
faker = "*"
scikit-learn = "*"
evaluate = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
