<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Optional: default Supabase project URL for this deployment (anon key still via Hub or form below). -->
<meta name="core-sentinel-supabase-url" content="">
<!-- Optional: force model records source (e.g., GitHub raw JSON URL). -->
<meta name="core-sentinel-model-records-url" content="">
<title>Model Health — Core Sentinel</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
      --bg: #080810;
      --card: #111118;
      --accent: #02C39A;
      --warn: #FFB300;
      --danger: #E53935;
      --text: #e8e8e8;
      --muted: #6b7280;
      --line: rgba(2,195,154,0.1);
      --grid: #1a1a22;
      --shadow: 0 4px 24px rgba(0,0,0,0.3);
      --radius: 12px;
      --maxw: 1360px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(1200px 420px at 80% -8%, rgba(2,195,154,0.12), transparent 55%), var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .container {
      width: min(var(--maxw), calc(100% - 28px));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 120;
      background: rgba(8,8,16,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .topbar::after {
      content: "";
      display: block;
      height: 1px;
      background: linear-gradient(90deg, rgba(2,195,154,0.95), rgba(2,195,154,0.18), transparent);
    }
    .topbar-inner {
      min-height: 72px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: #f6fffc;
    }
    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(145deg, #02C39A, #0f6f5d);
      display: grid;
      place-items: center;
      color: #05241d;
      font-size: 14px;
    }
    .crumb {
      color: var(--muted);
      font-weight: 500;
      font-size: 13px;
    }
    .status {
      justify-self: center;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #9ae6d6;
    }
    .policy-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.04);
      color: #cdece4;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .policy-chip.source-live {
      border-color: rgba(2,195,154,0.45);
      background: rgba(2,195,154,0.14);
      color: #9de7d0;
    }
    .policy-chip.source-cache {
      border-color: rgba(156,39,176,0.45);
      background: rgba(156,39,176,0.14);
      color: #dfc2ff;
    }
    .policy-chip.source-default {
      border-color: rgba(255,179,0,0.45);
      background: rgba(255,179,0,0.14);
      color: #ffe0a3;
    }
    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(2,195,154,0.55);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(2,195,154,0.5); }
      50% { box-shadow: 0 0 0 8px rgba(2,195,154,0); }
    }
    .actions {
      justify-self: end;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .btn {
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      transform: translateY(-2px);
      border-color: rgba(2,195,154,0.4);
    }
    .btn-accent {
      background: var(--accent);
      color: #05241d;
      border-color: rgba(2,195,154,0.7);
    }
    .btn[data-active="true"] {
      border-color: rgba(2,195,154,0.65);
      background: rgba(2,195,154,0.18);
      color: #cffff4;
    }

    main { padding: 14px 0 34px; }
    .page-title {
      font-size: clamp(1.35rem, 2.5vw, 1.85rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 14px;
      color: #fff;
    }
    .kpi-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      min-height: 102px;
    }
    .kpi-num {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--accent);
      line-height: 1.1;
    }
    .kpi-lbl {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .row { display: grid; gap: 10px; margin-bottom: 10px; }
    .row-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .row-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .row-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      min-height: 120px;
    }
    .card h3 {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 2px;
    }
    .sub {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .metric-val {
      font-size: 30px;
      line-height: 1;
      font-weight: 800;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .trend {
      font-size: 11px;
      font-weight: 700;
    }
    .trend.up { color: #9de7d0; }
    .trend.down { color: #ffb0ae; }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04);
      color: #cdece4;
      margin-right: 5px;
    }
    .badge.good { color: #9de7d0; border-color: rgba(2,195,154,0.35); background: rgba(2,195,154,0.12); }
    .badge.warn { color: #ffe0a3; border-color: rgba(255,179,0,0.35); background: rgba(255,179,0,0.12); }
    .badge.bad { color: #ffb0ae; border-color: rgba(229,57,53,0.35); background: rgba(229,57,53,0.12); }

    .sparkline {
      width: 100%;
      height: 46px;
      display: block;
      margin-top: 3px;
    }
    .gauge-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .gauge-wrap svg { width: 68px; height: 68px; }

    .chart-box {
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      background: #0e0e15;
      padding: 8px;
      overflow: hidden;
    }
    .chart-svg {
      width: 100%;
      height: 300px;
      display: block;
      overflow: visible;
    }
    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
    }
    .legend span::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 2px;
      margin-right: 5px;
      vertical-align: middle;
      background: #888;
    }
    .l-pr::before { background: var(--accent) !important; }
    .l-op::before { background: var(--danger) !important; }
    .l-target::before { background: var(--warn) !important; }
    .l-random::before { background: #7b7f8a !important; }

    .heatmap-svg {
      width: 100%;
      height: 240px;
      display: block;
    }
    .mini-note {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .table-wrap {
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: auto;
      max-height: 292px;
      background: #0f0f16;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.22) rgba(15, 15, 22, 0.9);
    }
    .table-wrap::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .table-wrap::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 4px;
    }
    .table-wrap::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 4px;
    }
    .table-wrap::-webkit-scrollbar-corner {
      background: transparent;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }
    th {
      position: sticky;
      top: 0;
      background: #151520;
      color: #98a2b3;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    td {
      padding: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 12px;
      color: #d7dde8;
      white-space: nowrap;
    }
    tbody tr:hover { background: rgba(255,255,255,0.03); }
    .ok { color: #9de7d0; font-weight: 700; }
    .warn { color: #ffd992; font-weight: 700; }
    .score-chip {
      display: inline-block;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.14);
    }
    .score-low { background: rgba(67,160,71,0.2); color: #b6e7bd; }
    .score-med { background: rgba(255,179,0,0.2); color: #ffe0a3; }
    .score-high { background: rgba(229,57,53,0.2); color: #ffb0ae; }

    .sim-grid {
      display: grid;
      gap: 10px;
    }
    .sim-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    .sim-values {
      margin-top: 4px;
      display: grid;
      gap: 6px;
      font-size: 12px;
      color: #c9d2df;
    }
    .sim-values strong { color: #fff; }

    .donut-wrap {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 10px;
      align-items: center;
    }
    .donut {
      width: 170px;
      height: 170px;
      display: block;
      margin: 0 auto;
    }
    .fpr-stats {
      display: grid;
      gap: 6px;
      font-size: 12px;
      color: #c9d2df;
    }

    .progress {
      margin-top: 10px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .progress > span {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #02C39A, #7af0d9);
    }

    .fp-table td:nth-child(5).ok { color: #9de7d0; }
    .fp-table td:nth-child(5).warn { color: #ffd992; }

    .tooltip {
      position: fixed;
      z-index: 400;
      background: rgba(8,8,14,0.95);
      border: 1px solid rgba(2,195,154,0.35);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 11px;
      color: #d8fff3;
      pointer-events: none;
      transform: translate(10px, 10px);
      display: none;
      white-space: nowrap;
    }

    .animate-path {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      transition: stroke-dashoffset 1.1s ease;
    }
    .chart-ready .animate-path {
      stroke-dashoffset: 0;
    }

    body.compact .container { width: min(var(--maxw), calc(100% - 18px)); }
    body.compact .topbar-inner { min-height: 60px; gap: 8px; }
    body.compact .brand { font-size: 13px; gap: 8px; }
    body.compact .crumb { font-size: 12px; }
    body.compact .status { font-size: 11px; }
    body.compact .policy-chip { font-size: 9px; padding: 2px 7px; }
    body.compact .btn { padding: 6px 10px; font-size: 11px; border-radius: 8px; }
    body.compact main { padding: 10px 0 22px; }
    body.compact .row { gap: 8px; margin-bottom: 8px; }
    body.compact .card { padding: 10px; border-radius: 10px; min-height: 0; }
    body.compact .card h3 { font-size: 13px; margin-bottom: 1px; }
    body.compact .sub, body.compact .mini-note, body.compact td { font-size: 11px; }
    body.compact .metric-val { font-size: 24px; margin-bottom: 2px; }
    body.compact .trend, body.compact .badge { font-size: 10px; }
    body.compact .sparkline { height: 34px; }
    body.compact .chart-box { padding: 6px; border-radius: 8px; }
    body.compact .chart-svg { height: 246px; }
    body.compact .heatmap-svg { height: 200px; }
    body.compact .table-wrap { max-height: 248px; border-radius: 8px; }
    body.compact th, body.compact td { padding: 6px; }
    body.compact .donut { width: 146px; height: 146px; }

    @media (max-width: 1180px) {
      .row-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .row-3 { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .row-2 { grid-template-columns: 1fr; }
      .topbar-inner { grid-template-columns: 1fr; padding: 8px 0; }
      .status { justify-self: start; }
      .actions { justify-self: start; }
    }
    @media (max-width: 700px) {
      .row-4 { grid-template-columns: 1fr; }
      .row-3 { grid-template-columns: 1fr; }
      .donut-wrap { grid-template-columns: 1fr; }
      .chart-svg { height: 270px; }
      .heatmap-svg { height: 220px; }
    }

    .sb-wrap { margin: 0 auto 16px; width: min(var(--maxw), calc(100% - 28px)); }
    .sb-details { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; }
    .sb-summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); list-style-position: outside; }
    .sb-grid { display: grid; gap: 10px; margin-top: 10px; }
    .sb-grid label { display: grid; gap: 4px; font-size: 11px; color: var(--muted); }
    .sb-grid input { background: var(--grid); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 8px 10px; border-radius: 8px; font-size: 12px; width: 100%; max-width: 520px; }
    .sb-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .sb-hint { margin: 0; line-height: 1.45; max-width: 720px; }

    @media print {
      body { background: #fff !important; color: #111 !important; }
      .topbar, .actions, .btn { display: none !important; }
      .card {
        background: #fff !important;
        color: #111 !important;
        border: 1px solid #ccc !important;
        box-shadow: none !important;
        break-inside: avoid;
      }
      .row { break-inside: avoid; }
      .sub, .mini-note, .legend, td, th { color: #333 !important; }
    }
</style>
</head>
<body>
  <div class="tooltip" id="chartTooltip"></div>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <span class="brand-mark">🛡</span>
        <span>Core Sentinel</span>
        <span class="crumb">/ ML</span>
  </div>
      <div class="status">
        <span class="pulse"></span>
        <span id="liveState">Live</span>
        <span id="lastUpdated">Updated —</span>
        <span id="modelVersionChip" class="policy-chip source-default">Version —</span>
        <span id="policySourceChip" class="policy-chip source-default">Policy —</span>
  </div>
      <div class="actions">
        <a class="btn" href="../hub.html">← Back to Hub</a>
        <button class="btn" id="densityBtn">Compact</button>
        <button class="btn" id="exportPdfBtn">Export PDF</button>
        <button class="btn btn-accent" id="refreshBtn">Refresh</button>
</div>
  </div>
  </header>

  <div class="sb-wrap" id="mlSbPanel">
    <details class="sb-details">
      <summary class="sb-summary">Supabase credentials</summary>
      <div id="mlSbAdminGate" class="sb-grid sb-gate">
        <label class="mini-note">Access key
          <input type="password" id="mlSbAccessKey" placeholder="Hub Admin key" autocomplete="off" style="max-width:320px;" />
        </label>
        <div class="sb-actions">
          <button type="button" class="btn btn-accent" id="mlSbUnlockBtn">Unlock</button>
          <span class="mini-note" id="mlSbGateErr" style="color:var(--warn);"></span>
        </div>
      </div>
      <div id="mlSbAdminForm" class="sb-grid" style="display:none;">
        <label>Project URL
          <input type="url" id="mlSbUrl" placeholder="https://…supabase.co" autocomplete="url" />
        </label>
        <label>Anon key
          <input type="password" id="mlSbKey" placeholder="eyJ…" autocomplete="off" />
        </label>
        <div class="sb-actions">
          <button type="button" class="btn btn-accent" id="mlSbSave">Save &amp; reload</button>
          <button type="button" class="btn" id="mlSbSignOut" style="border:1px solid var(--line);background:transparent;color:var(--muted);">Sign out</button>
        </div>
      </div>
      <p class="mini-note" id="mlSbStatus" style="margin-top:12px;color:var(--muted);"></p>
    </details>
  </div>

  <!-- If all network fetches for model_records fail, loadRetrainSummary() parses this (keep in sync when republishing docs/data/model_records.json). -->

  <main class="container">
    <h1 class="page-title">Model Health</h1>

    <section class="row row-4">
      <article class="card kpi-card">
        <div class="kpi-num countup" id="precisionMetric" data-decimals="3">—</div>
        <div class="kpi-lbl">Precision</div>
      </article>
      <article class="card kpi-card">
        <div class="kpi-num countup" id="recallMetric" data-decimals="3">—</div>
        <div class="kpi-lbl">Recall</div>
      </article>
      <article class="card kpi-card">
        <div class="kpi-num countup" id="f1Metric" data-decimals="3">—</div>
        <div class="kpi-lbl">F1</div>
      </article>
      <article class="card kpi-card">
        <div class="kpi-num countup" id="aucMetric" data-decimals="3">—</div>
        <div class="kpi-lbl">AUC</div>
      </article>
    </section>

    <section class="row row-2">
      <article class="card chart-card">
        <h3>Precision-Recall Curve</h3>
        <div class="chart-box" id="prChartCard">
          <svg class="chart-svg" id="prChart"></svg>
        </div>
        <div class="legend">
          <span class="l-pr">PR</span>
          <span class="l-op">OP</span>
          <span style="color:#22c55e;font-size:11px">● τ</span>
        </div>
      </article>

      <article class="card chart-card">
        <h3>Confusion Matrix</h3>
        <div class="chart-box">
          <svg class="heatmap-svg" id="cmChart"></svg>
        </div>
      </article>
    </section>

    <section class="row row-2">
      <article class="card">
        <h3>Threshold Simulator</h3>
        <div class="sim-grid">
          <div class="sim-row">
            <label for="warnSlider">Warn (<span id="warnVal">40</span>)</label>
            <span class="badge warn">20–60</span>
          </div>
          <input id="warnSlider" type="range" min="20" max="60" value="40">

          <div class="sim-row">
            <label for="blockSlider">Block (<span id="blockVal">70</span>)</label>
            <span class="badge bad">50–95</span>
          </div>
          <input id="blockSlider" type="range" min="50" max="95" value="70">

          <div class="sim-values">
            <div id="simBlock"><strong>—</strong></div>
            <div id="simWarn"><strong>—</strong></div>
            <div id="simSafe"><strong>—</strong></div>
            <div id="simFpr"><strong>—</strong></div>
          </div>

          <button type="button" class="btn btn-accent" id="applyConfigBtn">Copy threshold JSON</button>
        </div>
      </article>

    function parseSummaryJsonField(raw) {
      if (raw == null) return null;
      if (typeof raw === "object") return raw;
      if (typeof raw === "string") {
        try {
          const o = JSON.parse(raw);
          return typeof o === "object" && o ? o : null;
        } catch {
          return null;
        }
      }
      return null;

    /** JSON null / "" coerce to 0 with Number(); treat those as missing metrics. */
    function isPresentMetric(v) {
      if (v === null || v === undefined) return false;
      if (typeof v === "string" && v.trim() === "") return false;
      return true;
    }

    function isWebsiteRecordsSummary(summary) {
      if (!summary || typeof summary !== "object") return false;
      const datasetTrain = Number(summary?.dataset?.train_samples);
      const hasDataset = Number.isFinite(datasetTrain) && datasetTrain > 0;
      const sourceMode = String(summary?.source?.mode || "").toLowerCase();
      const metrics = summary.metrics && typeof summary.metrics === "object" ? summary.metrics : {};
      const hasRecommendedThreshold =
        isPresentMetric(metrics.recommended_threshold)
        && Number.isFinite(Number(metrics.recommended_threshold));
      const hasKeyMetrics =
        isPresentMetric(metrics.accuracy)
        && isPresentMetric(metrics.precision)
        && Number.isFinite(Number(metrics.accuracy))
        && Number.isFinite(Number(metrics.precision));
      const hasCurves = !!(
        summary.charts?.pr_curve_summary
        || summary.evaluation?.pr_curve_summary
        || summary.charts?.roc_curve_summary
        || summary.evaluation?.roc_curve_summary
      );
      const hasStamp = typeof summary.generated_at === "string" && summary.generated_at.length > 4;
      return (
        hasDataset
        || sourceMode.includes("sync")
        || (hasRecommendedThreshold && hasKeyMetrics)
        || (hasDataset && hasCurves && hasStamp)
        || (hasKeyMetrics && hasCurves && hasStamp)
      );
    }

    /** Absolute /.../data/model_records.json for sites hosted under a path (e.g. /Core_Sentinal/ml/). */
    function pathPrefixModelRecordsUrl() {
      try {
        const p = window.location.pathname || "";
        const i = p.indexOf("/ml");
        if (i === -1) return "";
        const base = p.slice(0, i).replace(/\/$/, "");
        const rel = base ? `${base}/data/model_records.json` : "/data/model_records.json";
        return new URL(rel, window.location.origin).href;
      } catch {
        return "";
      }
    }

    function getModelRecordsCandidates() {
      const metaEl = document.querySelector('meta[name="core-sentinel-model-records-url"]');
      const metaUrl = metaEl && metaEl.content ? metaEl.content.trim() : "";
      const override = (localStorage.getItem("model_records_url") || "").trim();
      const canonicalGithubRaw = "https://raw.githubusercontent.com/Alwinphilip0105/Core_Sentinal/main/docs/data/model_records.json";
      const cacheBust = `ts=${Date.now()}`;
      let sameOriginResolved = "";
      try {
        sameOriginResolved = new URL("../data/model_records.json", window.location.href).href;
      } catch {
        sameOriginResolved = "";
      }
      const pathPrefixResolved = pathPrefixModelRecordsUrl();
      return Array.from(
        new Set(
          [
            override,
            metaUrl,
            pathPrefixResolved,
            sameOriginResolved,
            "../data/model_records.json",
            "./../data/model_records.json",
            "../../docs/data/model_records.json",
            "./data/model_records.json",
            "data/model_records.json",
            `${canonicalGithubRaw}?${cacheBust}`,
            canonicalGithubRaw,
            "/docs/data/model_records.json",
            (() => {

              } catch {
                return "";
              }
            })(),
          ].filter(Boolean)
        )
      );
    }

    /** Macro AUPRC for KPIs when metrics.auc is absent (older Supabase rows). */
    function parseFprFromCalibrationMetricsVal(s) {
      if (!s || typeof s !== "string") return Number.NaN;
      const m = s.match(/fpr_non_high_as_high[^0-9]*([0-9.]+)/i);
      return m ? Number(m[1]) : Number.NaN;
    }

    function toPctMetric(raw) {
      if (!isPresentMetric(raw)) return Number.NaN;
      const n = Number(raw);
      if (!Number.isFinite(n)) return Number.NaN;
      return n <= 1 ? n * 100 : n;
    }

    function resolveFprBreakdown(summary) {
      const holdout = toPctMetric(summary?.metrics?.fpr_non_high_as_high);
      let calibration = toPctMetric(summary?.calibration?.fpr);
      if (!Number.isFinite(calibration)) {
        const tc = summary?.evaluation?.threshold_calibration;
        const rec = tc?.recommended || tc?.current_metrics;
        if (rec && typeof rec === "object") {
          calibration = toPctMetric(rec.fpr_non_high_as_high);
        }
      }
      if (!Number.isFinite(calibration)) {
        const s = summary?.policy?.inference_3class_labels?._calibration_metrics_val;
        calibration = toPctMetric(parseFprFromCalibrationMetricsVal(s));
      }
      return {
        holdout,
        calibration,
      };
    }

    function deriveMacroAuprc(summary) {
      if (!summary || typeof summary !== "object") return Number.NaN;
      if (isPresentMetric(summary.metrics?.auc)) {
        const m = Number(summary.metrics.auc);
        if (Number.isFinite(m)) return m;
      }
      const cls = summary.evaluation?.pr_curve_summary?.classes;
      if (cls && typeof cls === "object") {
        const vals = [];
        for (const k of ["low", "med", "high"]) {
          const v = Number(cls[k]?.auprc);
          if (Number.isFinite(v)) vals.push(v);
        }
        if (vals.length) return vals.reduce((a, b) => a + b, 0) / vals.length;
      }
      const pol = summary.policy?.thresholds;
      if (pol && typeof pol === "object") {
        const vals = [];
        for (const k of ["low", "med", "high"]) {
          const v = Number(pol[k]?.auprc);
          if (Number.isFinite(v)) vals.push(v);
        }
        if (vals.length) return vals.reduce((a, b) => a + b, 0) / vals.length;
      }
      return Number.NaN;
    }

    function asNumberArray(raw) {
      if (!Array.isArray(raw)) return [];
      return raw
        .map((v) => Number(v))
        .filter((v) => Number.isFinite(v));
    }

    function getHighPrCurve(summary) {
      const pr = summary?.evaluation?.pr_curve_summary;
      const hc = (pr && typeof pr === "object" && pr.high_class_curve && typeof pr.high_class_curve === "object")
        ? pr.high_class_curve
        : pr;
      if (!hc || typeof hc !== "object") return null;
      const recall = asNumberArray(hc.recall_values);
      const precision = asNumberArray(hc.precision_values);
      const thresholds = asNumberArray(hc.thresholds);
      if (!recall.length || !precision.length || recall.length !== precision.length) return null;
      const op = hc.operating_point && typeof hc.operating_point === "object" ? hc.operating_point : {};
      return {
        recall,
        precision,
        thresholds,
        operatingPoint: {
          precision: Number(op.precision),
          recall: Number(op.recall),
          threshold: Number(op.threshold),
        },
      };
    }

    function actionFromScore(score, policy) {
      const blockThr = Number(policy.block_threshold || DEFAULT_POLICY.block_threshold);
      const silentMax = Number(policy.risk_score_silent_max || DEFAULT_POLICY.risk_score_silent_max);
      if (score >= blockThr) return "block";
      if (score > silentMax) return "warn";
      return "silent";
    }

    function pctFromUnit(value, fallback) {
      if (!isPresentMetric(value)) return fallback;
      const n = Number(value);
      if (!Number.isFinite(n)) return fallback;
      return n <= 1 ? n * 100 : n;
    }

    async function loadRetrainSummary() {
      mlSbStatusRetrain = "";
      const localCandidates = getModelRecordsCandidates();
      for (const url of localCandidates) {
        try {
          const resp = await fetch(url, { cache: "no-store" });
          if (!resp.ok) continue;
          const data = await resp.json();
          if (isWebsiteRecordsSummary(data)) {
            modelRecordsSourceLabel = url;
            mlSbStatusRetrain = `Using website records: ${url}`;
            return data;
          }
        } catch {
          // try next candidate
        }
      }

      const sbUrl = (localStorage.getItem("sb_url") || "").trim().replace(/\/$/, "");
      const sbKey = (localStorage.getItem("sb_key") || "").trim();
      const configuredTable = (localStorage.getItem("retrain_runs_table") || "").trim();
      const tables = Array.from(new Set([configuredTable, "retrain_runs"].filter(Boolean)));
      const headers = {
        apikey: sbKey,
        Authorization: `Bearer ${sbKey}`,
        Accept: "application/json",
      };

      if (sbUrl && sbKey) {
        for (const table of tables) {
          const queryAttempts = [
            "select=summary_json,run_at&order=run_at.desc.nullslast&limit=1",
            "select=run_at,accuracy,precision,recall,f1,recall_high,recall_med,feedback_rows,fpr_non_high_as_high,model_version_tag,summary_json&order=run_at.desc.nullslast&limit=1",
          ];
          for (const qs of queryAttempts) {
            try {
              const resp = await fetch(`${sbUrl}/rest/v1/${encodeURIComponent(table)}?${qs}`, {
                headers,
                cache: "no-store",
              });
              const rawText = await resp.text();
              if (!resp.ok) {
                mlSbStatusRetrain = `${table}: HTTP ${resp.status} ${rawText.slice(0, 120)}`;
                continue;
              }
              let rows;
              try {
                rows = JSON.parse(rawText);
              } catch {
                mlSbStatusRetrain = `${table}: invalid JSON`;
                continue;
              }
              const row = Array.isArray(rows) ? rows[0] : null;
              if (!row) continue;
              const fromJson = parseSummaryJsonField(row.summary_json);
              if (isWebsiteRecordsSummary(fromJson)) {
                modelRecordsSourceLabel = `supabase:${table}`;
                mlSbStatusRetrain = "";
                return fromJson;
              }
              mlSbStatusRetrain = "Supabase retrain row is legacy schema; using local website records/defaults.";
            } catch (e) {
              mlSbStatusRetrain = `${table}: ${e && e.message ? e.message : String(e)}`;
            }
          }
        }
      } else {
        mlSbStatusRetrain = "Configure URL + anon key below (or save from Hub).";
      }
      modelRecordsSourceLabel = "unavailable";
      if (!mlSbStatusRetrain) {
        mlSbStatusRetrain =
          "Could not load docs/data/model_records.json (404/CORS/offline). KPIs stay at 0 or — until the file is reachable.";
      }
      const emb = document.getElementById("ml-model-records-fallback");
      if (emb && emb.textContent) {
        try {
          const data = JSON.parse(emb.textContent.trim());
          if (isWebsiteRecordsSummary(data)) {
            modelRecordsSourceLabel = "embedded-fallback";
            mlSbStatusRetrain = `${mlSbStatusRetrain} Using embedded KPI snapshot.`;
            return data;
          }
        } catch {
          /* ignore */
        }
      }
      return null;
    }

    function deriveModelRecordToken(summary) {
      if (!summary || typeof summary !== "object") return "";
      const generated = typeof summary.generated_at === "string" ? summary.generated_at : "";
      const runAt = typeof summary?.source?.run_at === "string" ? summary.source.run_at : "";
      const version = typeof summary?.model?.version_tag === "string" ? summary.model.version_tag : "";
      if (generated || runAt || version) {
        return `${generated}|${runAt}|${version}`;
      }
      try {
        return JSON.stringify(summary.metrics || {});
      } catch {
        return "";
      }
    }

    async function fetchModelRecordsToken() {
      for (const url of getModelRecordsCandidates()) {
        try {
          const resp = await fetch(url, { cache: "no-store" });
          if (!resp.ok) continue;
          const data = await resp.json();
          const token = deriveModelRecordToken(data);
          if (token) return token;
        } catch {
          // try next candidate
        }
      }
      return "";

    function applyRetrainSummary(summary) {
      if (!summary || typeof summary !== "object") {
        retrainSummary = null;
        const verChip = document.getElementById("modelVersionChip");
        if (verChip) verChip.textContent = "Version —";
        return;
      }
      if (summary.charts && typeof summary.charts === "object") {
        summary.evaluation = summary.evaluation || {};
        if (summary.charts.pr_curve_summary) {
          summary.evaluation.pr_curve_summary = summary.charts.pr_curve_summary;
        }
        if (summary.charts.roc_curve_summary) {
          summary.evaluation.roc_curve_summary = summary.charts.roc_curve_summary;
        }
      }
      retrainSummary = summary;
      const metrics = summary.metrics || {};
      const feedback = summary.feedback || {};
      const toPctOrNaN = (v) => {
        if (!isPresentMetric(v)) return Number.NaN;
        const n = Number(v);
        if (!Number.isFinite(n)) return Number.NaN;
        return n <= 1 ? n * 100 : n;
      };
      const toUnitOrNaN = (v) => {
        if (!isPresentMetric(v)) return Number.NaN;
        const n = Number(v);
        return Number.isFinite(n) ? n : Number.NaN;
      };
      const aucResolved = (() => {
        const direct = toUnitOrNaN(metrics.auc);
        if (Number.isFinite(direct)) return direct;
        return deriveMacroAuprc(summary);
      })();
      const precision = toUnitOrNaN(metrics.precision);
      const recall = toUnitOrNaN(metrics.recall);
      let f1 = toUnitOrNaN(metrics.f1);
      if (!Number.isFinite(f1) && Number.isFinite(precision) && Number.isFinite(recall) && precision + recall > 0) {
        f1 = (2 * precision * recall) / (precision + recall);
      }
      METRICS_STATIC = {
        ...METRICS_STATIC,
        accuracy: toPctOrNaN(metrics.accuracy),
        auc: aucResolved,
        precision,
        recall,
        f1,
        fnr: toUnitOrNaN(metrics.false_negative_rate_risky),
        roc_auc: toUnitOrNaN(metrics.roc_auc),
        fpr: pctFromUnit(metrics.fpr_non_high_as_high, METRICS_STATIC.fpr)
      };
      DEMO_METRICS = {
        ...DEMO_METRICS,
        feedbackRows: Number(feedback.rows_used_for_retrain ?? DEMO_METRICS.feedbackRows) || DEMO_METRICS.feedbackRows
      };
      if (summary.generated_at && usingDemo) {
        setLiveHeader(summary.generated_at, false);
      }
      const verChip = document.getElementById("modelVersionChip");
      if (verChip) {
        const vt = summary.model?.version_tag;
        verChip.textContent = vt ? `Version ${vt}` : "Version —";
      }
    }

    async function loadPolicyThresholds() {
      const storageKeys = ["core_sentinel_risk_policy", "risk_policy_json"];
      for (const key of storageKeys) {
        const raw = localStorage.getItem(key);
        if (!raw) continue;
        try {
          const parsed = JSON.parse(raw);
          return {
            policy: {
              block_threshold: Number(parsed.block_threshold || DEFAULT_POLICY.block_threshold),
              risk_score_silent_max: Number(
                parsed.risk_score_silent_max
                || parsed.risk_score_warn_floor
                || DEFAULT_POLICY.risk_score_silent_max
              )
            },
            source: {
              kind: "cache",
              label: "Local cache",
              details: key
            }
          };
        } catch {
          // ignore malformed cache
        }
      }
      const candidates = [
        "./risk_policy.json",
        "../../core-sentinel-guardrail/config/risk_policy.json",
        "../core-sentinel-guardrail/config/risk_policy.json",
        "/core-sentinel-guardrail/config/risk_policy.json"
      ];
      for (const url of candidates) {
        try {
          const resp = await fetch(url, { cache: "no-store" });
          if (!resp.ok) continue;
          const data = await resp.json();
          return {
            policy: {
              block_threshold: Number(data.block_threshold || DEFAULT_POLICY.block_threshold),
              risk_score_silent_max: Number(data.risk_score_silent_max || DEFAULT_POLICY.risk_score_silent_max)
            },
            source: {
              kind: "live",
              label: "Live policy file",
              details: url
            }
          };
        } catch {
          // keep trying candidates
        }
      }
    return {
        policy: { ...DEFAULT_POLICY },
        source: {
          kind: "default",
          label: "Fallback defaults",
          details: "inline defaults"
        }
      };
    }

    function applyPolicySourceChip(source, policy) {
      const chip = document.getElementById("policySourceChip");
      if (!chip || !source) return;
      chip.classList.remove("source-live", "source-cache", "source-default");
      const mode = source.kind === "live" ? "source-live" : source.kind === "cache" ? "source-cache" : "source-default";
      chip.classList.add(mode);
      chip.textContent = `Policy: ${source.label}`;
      const block = Number(policy?.block_threshold ?? DEFAULT_POLICY.block_threshold);
      const silentMax = Number(policy?.risk_score_silent_max ?? DEFAULT_POLICY.risk_score_silent_max);
      const warnFrom = silentMax + 1;
      const thresholdLine = `Thresholds: block=${block}, silent_max=${silentMax}, warn_from=${warnFrom}`;
      chip.title = source.details
        ? `Threshold source: ${source.details}\n${thresholdLine}`
        : thresholdLine;
    }

    function fmtAgo(ts) {
      if (!ts) return "Updated --";
      const diff = Math.max(0, Date.now() - new Date(ts).getTime());
      const m = Math.floor(diff / 60000);
      if (m < 1) return "Updated just now";
      if (m < 60) return `Updated ${m} min ago`;
      return `Updated ${Math.floor(m / 60)} hr ago`;
    }

    function setLiveHeader(ts, live) {
      document.getElementById("lastUpdated").textContent = fmtAgo(ts);
      document.getElementById("liveState").textContent = live ? "Live" : "Demo";
      const pulse = document.querySelector(".pulse");
      if (pulse) pulse.style.background = live ? "var(--accent)" : "#8a90a0";
    }

    function countUp(el, target, decimals, suffix) {
      if (!Number.isFinite(target)) {
        el.textContent = "—";
        return;
      }
      const start = 0;
      const dur = 900;
      const t0 = performance.now();
      function step(t) {
        const p = Math.min(1, (t - t0) / dur);
        const eased = 1 - Math.pow(1 - p, 3);
        const val = start + (target - start) * eased;
        const out = decimals > 0 ? val.toFixed(decimals) : Math.round(val).toString();
        el.textContent = out + (suffix || "");
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function animateCounters() {
      document.querySelectorAll(".countup").forEach((el) => {
        const raw = el.dataset.target;
        let target = Number.NaN;
        if (raw !== undefined && raw !== "") {
          const n = Number(raw);
          if (Number.isFinite(n)) target = n;
        }
        const dec = Number(el.dataset.decimals ?? 3);
        const suffix = el.dataset.suffix || "";
        countUp(el, target, dec, suffix);
      });
    }

    function setGauge(arcEl, pct, circumference) {
      const clamped = Math.max(0, Math.min(100, pct));
      arcEl.style.strokeDasharray = String(circumference);
      arcEl.style.strokeDashoffset = String(circumference * (1 - clamped / 100));
    }

    function normalizeEvent(raw) {
      const ts = raw.timestamp || raw.created_at || raw.scanned_at || new Date().toISOString();
      const score = Number(raw.risk_score || raw.score || 0);
      const risk = String(
        raw.risk
        || (score >= runtimePolicy.block_threshold ? "high" : score > runtimePolicy.risk_score_silent_max ? "med" : "low")
      ).toLowerCase();
      const action = String(raw.action || raw.decision || actionFromScore(score, runtimePolicy));
      const pii = raw.pii_classes || raw.triggers || raw.pii_type || [];
      const piiText = Array.isArray(pii) ? (pii[0] || "low") : String(pii || "low");
      // Do not synthesize feedback on live events; drift should reflect real corrections only.
      const feedback = raw.feedback || raw.feedback_type || "";
      return { ts, score, risk, action, pii: piiText, feedback };
    }

    function generateDemoEvents() {
      const now = Date.now();
      const classes = ["email (work)", "phone (office)", "full name", "address", "date pattern", "API key pattern", "SSN (partial)"];
      const out = [];
      for (let i = 0; i < DEMO_METRICS.totalScored; i++) {
        let score;
        if (i < DEMO_METRICS.blocks) score = 78 + (i % 20);
        else if (i < DEMO_METRICS.blocks + DEMO_METRICS.warns) score = 34 + (i % 22);
        else score = 8 + (i % 22);
        const action = actionFromScore(score, runtimePolicy);
        out.push({
          timestamp: new Date(now - i * 30 * 60 * 1000).toISOString(),
          risk_score: score,
          action,
          pii_type: classes[i % classes.length],
          feedback: i < DEMO_METRICS.wrong ? "wrong" : "correct",
          used_for_training: i < DEMO_METRICS.feedbackRows
        });
      }
      return out.map(normalizeEvent);
    }

    async function fetchEvents() {
      mlSbStatusEvents = "";
      const url = (localStorage.getItem("sb_url") || "").trim().replace(/\/$/, "");
      const key = (localStorage.getItem("sb_key") || "").trim();
      if (!url || !key) {
        usingDemo = true;
        mlSbStatusEvents = "No Supabase URL/key — using demo events.";
        return generateDemoEvents();
      }
      const evHeaders = {
        apikey: key,
        Authorization: `Bearer ${key}`,
        Accept: "application/json",
      };
      try {
        const r = await fetch(
          `${url}/rest/v1/guardrail_events?select=id,timestamp,risk_score,action,pii_classes,llm_name,text_hash&order=timestamp.desc.nullslast,id.desc&limit=4000`,
          { headers: evHeaders, cache: "no-store" }
        );
        const rawText = await r.text();
        if (!r.ok) {
          mlSbStatusEvents = `guardrail_events: HTTP ${r.status} ${rawText.slice(0, 160)}`;
          usingDemo = true;
          return generateDemoEvents();
        }
        let rows;
        try {
          rows = JSON.parse(rawText);
        } catch {
          mlSbStatusEvents = "guardrail_events: invalid JSON";
          usingDemo = true;
          return generateDemoEvents();
        }
        if (!Array.isArray(rows)) {
          mlSbStatusEvents = "guardrail_events: unexpected response";
          usingDemo = true;
          return generateDemoEvents();
        }
        usingDemo = false;
        if (!rows.length) {
          mlSbStatusEvents = "Connected — no rows in guardrail_events yet.";
        }
        return rows.map(normalizeEvent);
      } catch (e) {
        mlSbStatusEvents = e && e.message ? e.message : String(e);
        usingDemo = true;
        return generateDemoEvents();
      }
    }

    function computeMetrics(events) {
      const totalScored = events.length || 0;
      if (usingDemo) {
        let fprDemo = DEMO_METRICS.fpr;
        let fprSrc = "demo";
        let fh = Number.NaN;
        let fc = Number.NaN;
        if (retrainSummary && retrainSummary.metrics) {
          const mh = Number(retrainSummary.metrics.fpr_non_high_as_high);
          const mc = retrainSummary.calibration ? Number(retrainSummary.calibration.fpr) : Number.NaN;
          if (Number.isFinite(mh)) fh = mh <= 1 ? mh * 100 : mh;
          if (Number.isFinite(mc)) fc = mc <= 1 ? mc * 100 : mc;
          if (Number.isFinite(fc)) {
            fprDemo = fc;
            fprSrc = "calibration";
          } else if (Number.isFinite(fh)) {
            fprDemo = fh;
            fprSrc = "holdout";
          }
        }
        return {
          ...DEMO_METRICS,
          fpr: fprDemo,
          hasFeedbackLabels: true,
          fprSource: fprSrc,
          fprHoldout: fh,
          fprCalibration: fc,
        };
      }
      const blocks = events.filter((e) => e.action === "block").length;
      const warns = events.filter((e) => e.action === "warn").length;
      const feedbackRows = events.filter((e) => String(e.feedback).trim().length > 0);
      const hasFeedbackLabels = feedbackRows.length >= 20;
      const wrong = events.filter((e) => String(e.feedback).toLowerCase().includes("wrong")).length;
      const wrongInterventions = events.filter(
        (e) => String(e.feedback).toLowerCase().includes("wrong") && (e.action === "warn" || e.action === "block")
      ).length;
      const snoozed = events.filter((e) => e.action === "snooze").length;
      const overrides = events.filter((e) => e.action === "override").length;
      let fpr = hasFeedbackLabels && (blocks + warns > 0)
        ? (wrongInterventions / (blocks + warns)) * 100
        : Number.NaN;
      let fprFromCalibration = false;
      let fprHoldout = Number.NaN;
      let fprCalibration = Number.NaN;
      let fprSource = "feedback";
      if (!Number.isFinite(fpr) && !usingDemo && retrainSummary) {
        const fb = resolveFprBreakdown(retrainSummary);
        fprHoldout = fb.holdout;
        fprCalibration = fb.calibration;
        if (Number.isFinite(fprCalibration)) {
          fpr = fprCalibration;
          fprFromCalibration = true;
          fprSource = "calibration";
        } else if (Number.isFinite(fprHoldout)) {
          fpr = fprHoldout;
          fprSource = "holdout";
        }
      } else if (Number.isFinite(fpr)) {
        fprSource = "feedback";
      }
      const overrideRate = totalScored > 0 ? (overrides / totalScored) * 100 : 0;

      const weekMs = 7 * 24 * 60 * 60 * 1000;
      const byWeek = new Map();
      events.forEach((e) => {
        const d = new Date(e.ts);
        if (Number.isNaN(d.getTime())) return;
        const wk = Math.floor(d.getTime() / weekMs) * weekMs;
        if (!byWeek.has(wk)) byWeek.set(wk, { total: 0, wrong: 0 });
        const cur = byWeek.get(wk);
        cur.total += 1;
        if (String(e.feedback).toLowerCase().includes("wrong")) cur.wrong += 1;
      });
      const weeklyRates = Array.from(byWeek.entries())
        .sort((a, b) => a[0] - b[0])
        .slice(-8)
        .map(([, v]) => (v.total ? (v.wrong / v.total) * 100 : 0));
      while (weeklyRates.length < 8) weeklyRates.unshift(0);
      const hasCorrections = events.some((e) => String(e.feedback).toLowerCase().includes("wrong"));

      return {
        totalScored,
        blocks,
        warns,
        wrong,
        snoozed,
        overrideRate,
        fpr,
        fprFromCalibration,
        fprSource,
        fprHoldout,
        fprCalibration,
        hasFeedbackLabels,
        hasCorrections,
        weeklyRates
      };
    }

    function scoreBand(score) {
      if (score >= runtimePolicy.block_threshold) return "HIGH";
      if (score > runtimePolicy.risk_score_silent_max) return "MED";
      return "LOW";
    }

    function timeAgo(ts) {
      const diff = Date.now() - new Date(ts).getTime();
      const m = Math.max(1, Math.floor(diff / 60000));
      if (m < 60) return `${m} min ago`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h} hr ago`;
      return `${Math.floor(h / 24)} day ago`;
    }

    function renderFalsePositiveLog(events) {
      const tbody = document.getElementById("fpRows");
      if (!tbody) return;
      tbody.innerHTML = "";
      if (usingDemo) {
        DEMO_FALSE_POSITIVE_LOG.forEach((row) => {
          const cls = row[1].startsWith("HIGH") ? "score-high" : row[1].startsWith("MED") ? "score-med" : "score-low";
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row[0]}</td>
            <td><span class="score-chip ${cls}">${row[1]}</span></td>
            <td>${row[2]}</td>
            <td>${row[3]}</td>
            <td class="warn">${row[4]}</td>
          `;
          tbody.appendChild(tr);
        });
        return;
      }
      const wrongRows = events.filter((e) => String(e.feedback).toLowerCase().includes("wrong")).slice(0, 20);
      const rows = wrongRows.length ? wrongRows : events.slice(0, 20);
      rows.forEach((e) => {
        const band = scoreBand(e.score);
        const cls = band === "HIGH" ? "score-high" : band === "MED" ? "score-med" : "score-low";
        const isWrong = String(e.feedback).toLowerCase().includes("wrong");
        const feedbackTxt = isWrong ? `✗ Wrong → ${band === "HIGH" ? "Safe" : "Medium"}` : "✓ Correct";
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${timeAgo(e.ts)}</td>
          <td><span class="score-chip ${cls}">${band} (${e.score})</span></td>
          <td>${e.pii}</td>
          <td>${e.action}</td>
          <td class="${isWrong ? "warn" : "ok"}">${feedbackTxt}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderActiveLearning(events) {
      const container = document.getElementById("alContent");
      if (!container) return;
      const feedbackRows = events.filter((e) => String(e.feedback).toLowerCase().includes("wrong"));
      const total = usingDemo ? DEMO_METRICS.feedbackRows : (feedbackRows.length || 47);
      const used = Math.min(Math.floor(total * 0.26), total);
      const threshold = 100;
      const remaining = Math.max(0, threshold - total);
      const pct = Math.max(0, Math.min(100, (total / threshold) * 100));
      const patt = [
        ["Email → Safe", 12, "Downgrade"],
        ["Phone → Medium", 8, "Downgrade"],
        ["Full Name → High", 6, "Upgrade"],
        ["Address → Safe", 5, "Downgrade"],
        ["DOB → Medium", 4, "Stable"]
      ];
      container.innerHTML = `
        <p class="sub"><span class="ok">✓</span> ${total} feedback rows synced</p>
        <div class="progress"><span id="alProgressBar" style="width:${pct.toFixed(1)}%"></span></div>
        <p class="mini-note">${total}/${threshold} toward retrain threshold</p>
        <div class="table-wrap" style="max-height:180px;margin-top:8px;">
          <table>
            <thead><tr><th>Pattern</th><th>Count</th><th>Direction</th></tr></thead>
            <tbody>
              ${patt.map((p) => `<tr><td>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td></tr>`).join("")}
            </tbody>
          </table>
        </div>
        <p class="mini-note">Next retrain: ${remaining} more corrections needed</p>
      `;
    }

    function renderClassPerfTable() {
      const tbody = document.querySelector("#classPerfTable tbody");
      if (!tbody) return;
      const key = classSort.key;
      const dir = classSort.dir === "asc" ? 1 : -1;
      const keyFn = (r) => {
        if (key === "class") return r[0];
        if (key === "sensitivity") return r[1];
        if (key === "expected") return r[2];
        if (key === "actual") return r[3];
        if (key === "range") return Number(r[4].split("-")[0]);
        if (key === "status") return r[5];
        return r[0];
      };
      const rows = [...CLASS_PERF_ROWS].sort((a, b) => {
        const av = keyFn(a), bv = keyFn(b);
        if (typeof av === "number" && typeof bv === "number") return (av - bv) * dir;
        return String(av).localeCompare(String(bv)) * dir;
      });
      tbody.innerHTML = rows.map((r) => `
        <tr>
          <td>${r[0]}</td>
          <td>${r[1]}</td>
          <td>${r[2]}</td>
          <td>${r[3]}</td>
          <td>${r[4]}</td>
          <td class="${r[5] === "ok" ? "ok" : "warn"}">${r[5] === "ok" ? "✅" : "⚠️"}</td>
        </tr>
      `).join("");
    }

    function drawAxes(svg, x, y, w, h, xLabel, yLabel) {
      const ns = "http://www.w3.org/2000/svg";
      const g = document.createElementNS(ns, "g");
      const axis = document.createElementNS(ns, "path");
      axis.setAttribute("d", `M ${x} ${y+h} L ${x+w} ${y+h} M ${x} ${y} L ${x} ${y+h}`);
      axis.setAttribute("stroke", "rgba(255,255,255,0.3)");
      axis.setAttribute("stroke-width", "1");
      g.appendChild(axis);

      const xTxt = document.createElementNS(ns, "text");
      xTxt.setAttribute("x", x + w / 2);
      xTxt.setAttribute("y", y + h + 32);
      xTxt.setAttribute("text-anchor", "middle");
      xTxt.setAttribute("fill", "#7a8393");
      xTxt.setAttribute("font-size", "11");
      xTxt.textContent = xLabel;
      g.appendChild(xTxt);

      const yTxt = document.createElementNS(ns, "text");
      yTxt.setAttribute("x", x - 38);
      yTxt.setAttribute("y", y + h / 2);
      yTxt.setAttribute("text-anchor", "middle");
      yTxt.setAttribute("fill", "#7a8393");
      yTxt.setAttribute("font-size", "11");
      yTxt.setAttribute("transform", `rotate(-90 ${x - 38} ${y + h / 2})`);
      yTxt.textContent = yLabel;
      g.appendChild(yTxt);
      svg.appendChild(g);
    }

    function addGrid(svg, x, y, w, h, xTicks = 8, yTicks = 6) {
      const ns = "http://www.w3.org/2000/svg";
      const g = document.createElementNS(ns, "g");
      for (let i = 0; i <= xTicks; i++) {
        const lx = x + (w * i / xTicks);
        const line = document.createElementNS(ns, "line");
        line.setAttribute("x1", lx);
        line.setAttribute("y1", y);
        line.setAttribute("x2", lx);
        line.setAttribute("y2", y + h);
        line.setAttribute("stroke", "var(--grid)");
        line.setAttribute("stroke-width", "1");
        g.appendChild(line);
      }
      for (let j = 0; j <= yTicks; j++) {
        const ly = y + (h * j / yTicks);
        const line = document.createElementNS(ns, "line");
        line.setAttribute("x1", x);
        line.setAttribute("y1", ly);
        line.setAttribute("x2", x + w);
        line.setAttribute("y2", ly);
        line.setAttribute("stroke", "var(--grid)");
        line.setAttribute("stroke-width", "1");
        g.appendChild(line);
      }
      svg.appendChild(g);
    }

    function addHoverablePoint(svg, cx, cy, color, label) {
      const ns = "http://www.w3.org/2000/svg";
      const pt = document.createElementNS(ns, "circle");
      pt.setAttribute("cx", cx);
      pt.setAttribute("cy", cy);
      pt.setAttribute("r", "3.5");
      pt.setAttribute("fill", color);
      pt.setAttribute("stroke", "#fff");
      pt.setAttribute("stroke-width", "1");
      pt.addEventListener("mousemove", (e) => {
        tooltip.textContent = label;
        tooltip.style.display = "block";
        tooltip.style.left = `${e.clientX}px`;
        tooltip.style.top = `${e.clientY}px`;
      });
      pt.addEventListener("mouseleave", () => {
        tooltip.style.display = "none";
      });
      svg.appendChild(pt);
    }

    function drawPRChart() {
      const svg = document.getElementById("prChart");
      const w = svg.clientWidth || 560;
      const h = svg.clientHeight || 300;
      svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
      svg.innerHTML = "";
      const pad = { l: 54, r: 16, t: 16, b: 44 };
      const cx = pad.l, cy = pad.t, cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
      addGrid(svg, cx, cy, cw, ch, 8, 6);
      drawAxes(svg, cx, cy, cw, ch, "Recall", "Precision");

      const mapX = (r) => cx + r * cw;
      const mapY = (p) => cy + (1 - p) * ch;

      const ns = "http://www.w3.org/2000/svg";
      const targetLine = document.createElementNS(ns, "line");
      targetLine.setAttribute("x1", cx);
      targetLine.setAttribute("x2", cx + cw);
      targetLine.setAttribute("y1", mapY(0.90));
      targetLine.setAttribute("y2", mapY(0.90));
      targetLine.setAttribute("stroke", "var(--warn)");
      targetLine.setAttribute("stroke-width", "1.5");
      targetLine.setAttribute("stroke-dasharray", "5 5");
      svg.appendChild(targetLine);

      const curve = getHighPrCurve(retrainSummary);
      if (curve) {
        const nsPath = "http://www.w3.org/2000/svg";
        const pts = curve.recall.map((r, i) => [Math.max(0, Math.min(1, r)), Math.max(0, Math.min(1, curve.precision[i] || 0))]);
        const pathD = pts.map((p, i) => `${i ? "L" : "M"}${mapX(p[0]).toFixed(2)} ${mapY(p[1]).toFixed(2)}`).join(" ");
        const path = document.createElementNS(nsPath, "path");
        path.setAttribute("d", pathD);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "var(--accent)");
        path.setAttribute("stroke-width", "2.5");
        path.classList.add("animate-path");
        svg.appendChild(path);
        const op = curve.operatingPoint || {};
        if (Number.isFinite(op.recall) && Number.isFinite(op.precision)) {
          addHoverablePoint(
            svg,
            mapX(Math.max(0, Math.min(1, op.recall))),
            mapY(Math.max(0, Math.min(1, op.precision))),
            "var(--danger)",
            `Eval sweep: P=${op.precision.toFixed(3)} R=${op.recall.toFixed(3)}`
          );
        }
        const prBox = retrainSummary?.evaluation?.pr_curve_summary;
        const hcBox = prBox?.high_class_curve || prBox;
        const hop = hcBox?.holdout_threshold_point;
        if (hop && Number.isFinite(Number(hop.recall)) && Number.isFinite(Number(hop.precision))) {
          addHoverablePoint(
            svg,
            mapX(Math.max(0, Math.min(1, Number(hop.recall)))),
            mapY(Math.max(0, Math.min(1, Number(hop.precision)))),
            "#22c55e",
            `Holdout τ=${Number(hop.threshold).toFixed(2)}  P=${Number(hop.precision).toFixed(3)} R=${Number(hop.recall).toFixed(3)}`
          );
        }
        return;
      }

      const polHigh = retrainSummary?.policy?.thresholds?.high;
      const polAuprc = Number(polHigh?.auprc);
      if (retrainSummary && Number.isFinite(polAuprc)) {
        addHoverablePoint(
          svg,
          mapX(0.5),
          mapY(Math.max(0.1, Math.min(0.99, polAuprc))),
          "var(--accent)",
          `High-class AUPRC (from policy) ≈ ${polAuprc.toFixed(3)}`
        );
        return;
      }

      if (usingDemo) {
        const prPath = PR_POINTS.map((d, i) => `${i ? "L" : "M"}${mapX(d[0]).toFixed(2)} ${mapY(d[1]).toFixed(2)}`).join(" ");
        const path = document.createElementNS(ns, "path");
        path.setAttribute("d", prPath);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "var(--accent)");
        path.setAttribute("stroke-width", "2.5");
        path.classList.add("animate-path");
        svg.appendChild(path);
        PR_POINTS.forEach((p) => {
          addHoverablePoint(svg, mapX(p[0]), mapY(p[1]), "var(--accent)", `Demo point  P=${p[1].toFixed(3)}  R=${p[0].toFixed(3)}`);
        });
      }
    }

    function drawConfusionMatrix() {
      const svg = document.getElementById("cmChart");
      const w = svg.clientWidth || 560;
      const h = svg.clientHeight || 240;
      svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
      svg.innerHTML = "";
      const ns = "http://www.w3.org/2000/svg";
      const holdoutCm = retrainSummary?.metrics?.confusion_holdout;
      if (
        holdoutCm
        && typeof holdoutCm === "object"
        && [holdoutCm.tp, holdoutCm.tn, holdoutCm.fp, holdoutCm.fn].every((v) => Number.isFinite(Number(v)))
      ) {
        const tp = Number(holdoutCm.tp);
        const tn = Number(holdoutCm.tn);
        const fp = Number(holdoutCm.fp);
        const fn = Number(holdoutCm.fn);
        const labels = ["Pred: not risky", "Pred: risky"];
        const rows = ["Actual: not risky", "Actual: risky"];
        const data = [
          [tn, fp],
          [fn, tp],
        ];
        const max = Math.max(...data.flat(), 1);
        const x0 = 140,
          y0 = 36,
          cw = 140,
          chm = 72;
        labels.forEach((lb, i) => {
          const t = document.createElementNS(ns, "text");
          t.setAttribute("x", x0 + i * cw + cw / 2);
          t.setAttribute("y", 20);
          t.setAttribute("text-anchor", "middle");
          t.setAttribute("fill", "#8e97a8");
          t.setAttribute("font-size", "11");
          t.textContent = lb;
          svg.appendChild(t);
        });
        rows.forEach((rb, r) => {
          const t = document.createElementNS(ns, "text");
          t.setAttribute("x", 8);
          t.setAttribute("y", y0 + r * chm + chm / 2 + 4);
          t.setAttribute("fill", "#8e97a8");
          t.setAttribute("font-size", "11");
          t.textContent = rb;
          svg.appendChild(t);
        });
        const totals = data.map((row) => row.reduce((a, b) => a + b, 0));
        for (let r = 0; r < data.length; r++) {
          for (let c = 0; c < data[r].length; c++) {
            const v = data[r][c];
            const isDiag = (r === 0 && c === 0) || (r === 1 && c === 1);
            const alpha = max ? Math.max(0.08, v / max) : 0.08;
            const fill = isDiag
              ? `rgba(2,195,154,${Math.min(0.9, alpha + 0.1)})`
              : `rgba(229,57,53,${Math.min(0.75, alpha + 0.06)})`;
            const rect = document.createElementNS(ns, "rect");
            rect.setAttribute("x", x0 + c * cw + 2);
            rect.setAttribute("y", y0 + r * chm + 2);
            rect.setAttribute("width", cw - 4);
            rect.setAttribute("height", chm - 4);
            rect.setAttribute("rx", 7);
            rect.setAttribute("fill", fill);
            rect.setAttribute("stroke", "rgba(255,255,255,0.15)");
            rect.setAttribute("stroke-width", "1");
            const pct = totals[r] ? ((v / totals[r]) * 100).toFixed(2) : "0.00";
            rect.addEventListener("mousemove", (e) => {
              tooltip.textContent = `${rows[r]} → ${labels[c]} : ${v} (${pct}%)`;
              tooltip.style.display = "block";
              tooltip.style.left = `${e.clientX}px`;
              tooltip.style.top = `${e.clientY}px`;
            });
            rect.addEventListener("mouseleave", () => {
              tooltip.style.display = "none";
            });
            svg.appendChild(rect);
            const t = document.createElementNS(ns, "text");
            t.setAttribute("x", x0 + c * cw + cw / 2);
            t.setAttribute("y", y0 + r * chm + chm / 2 + 4);
            t.setAttribute("text-anchor", "middle");
            t.setAttribute("fill", "#ecf7f3");
            t.setAttribute("font-size", "13");
            t.setAttribute("font-weight", "700");
            t.textContent = String(v);
            svg.appendChild(t);
          }
        }
        return;
      }

      const labels = ["Pred:Low", "Pred:Med", "Pred:High"];
      const rows = ["Actual:Low", "Actual:Med", "Actual:High"];
      const data = CONFUSION_MATRIX;
      const max = Math.max(...data.flat());
      const x0 = 120, y0 = 36, cw = 120, cellH = 54;

      labels.forEach((lb, i) => {
        const t = document.createElementNS(ns, "text");
        t.setAttribute("x", x0 + i * cw + cw / 2);
        t.setAttribute("y", 20);
        t.setAttribute("text-anchor", "middle");
        t.setAttribute("fill", "#8e97a8");
        t.setAttribute("font-size", "11");
        t.textContent = lb;
        svg.appendChild(t);
      });
      rows.forEach((rb, r) => {
        const t = document.createElementNS(ns, "text");
        t.setAttribute("x", 10);
        t.setAttribute("y", y0 + r * cellH + cellH / 2 + 4);
        t.setAttribute("fill", "#8e97a8");
        t.setAttribute("font-size", "11");
        t.textContent = rb;
        svg.appendChild(t);
      });

      const totals = data.map((row) => row.reduce((a,b)=>a+b,0));
      for (let r = 0; r < data.length; r++) {
        for (let c = 0; c < data[r].length; c++) {
          const v = data[r][c];
          const isDiag = r === c;
          const alpha = max ? Math.max(0.08, v / max) : 0.08;
          const fill = isDiag ? `rgba(2,195,154,${Math.min(0.9, alpha + 0.1)})` : `rgba(229,57,53,${Math.min(0.75, alpha + 0.06)})`;
          const rect = document.createElementNS(ns, "rect");
          rect.setAttribute("x", x0 + c * cw + 2);
          rect.setAttribute("y", y0 + r * cellH + 2);
          rect.setAttribute("width", cw - 4);
          rect.setAttribute("height", cellH - 4);
          rect.setAttribute("rx", 7);
          rect.setAttribute("fill", fill);
          rect.setAttribute("stroke", "rgba(255,255,255,0.15)");
          rect.setAttribute("stroke-width", "1");
          const pct = totals[r] ? ((v / totals[r]) * 100).toFixed(2) : "0.00";
          rect.addEventListener("mousemove", (e) => {
            tooltip.textContent = `${rows[r]} -> ${labels[c]} : ${v} (${pct}%)`;
            tooltip.style.display = "block";
            tooltip.style.left = `${e.clientX}px`;
            tooltip.style.top = `${e.clientY}px`;
          });
          rect.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
          svg.appendChild(rect);

          const t = document.createElementNS(ns, "text");
          t.setAttribute("x", x0 + c * cw + cw / 2);
          t.setAttribute("y", y0 + r * cellH + cellH / 2 + 4);
          t.setAttribute("text-anchor", "middle");
          t.setAttribute("fill", "#ecf7f3");
          t.setAttribute("font-size", "13");
          t.setAttribute("font-weight", "700");
          t.textContent = String(v);
          svg.appendChild(t);
        }
      }
    }

    function drawDriftChart(rates) {
      const svg = document.getElementById("driftChart");
      if (!svg) return;
      const w = svg.clientWidth || 560;
      const h = svg.clientHeight || 300;
      svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
      svg.innerHTML = "";
      const pad = { l: 46, r: 12, t: 14, b: 38 };
      const cx = pad.l, cy = pad.t, cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
      addGrid(svg, cx, cy, cw, ch, 7, 6);
      drawAxes(svg, cx, cy, cw, ch, "Week", "Correction %");
      const ns = "http://www.w3.org/2000/svg";
      const safeRatesRaw = Array.isArray(rates) ? rates : [];
      const safeRates = safeRatesRaw
        .map((v) => {
          const n = Number(v);
          if (!Number.isFinite(n)) return 0;
          return Math.max(0, Math.min(100, n));
        })
        .slice(-8);
      while (safeRates.length < 8) safeRates.unshift(0);
      const peak = Math.max(...safeRates, 0);
      const maxY = Math.max(20, Math.ceil((peak + 2) / 5) * 5);
      const mapX = (i) => cx + (i / 7) * cw;
      const mapY = (v) => {
        const vv = Math.max(0, Math.min(maxY, Number(v) || 0));
        return cy + (1 - (vv / maxY)) * ch;
      };

      for (let i = 0; i < 8; i++) {
        const tx = document.createElementNS(ns, "text");
        tx.setAttribute("x", mapX(i));
        tx.setAttribute("y", cy + ch + 14);
        tx.setAttribute("text-anchor", "middle");
        tx.setAttribute("fill", "#7a8393");
        tx.setAttribute("font-size", "10");
        tx.textContent = `W${i + 1}`;
        svg.appendChild(tx);
      }

      const warnY = mapY(8);
      const retrainY = mapY(15);
      const wLine = document.createElementNS(ns, "line");
      wLine.setAttribute("x1", cx); wLine.setAttribute("x2", cx + cw);
      wLine.setAttribute("y1", warnY); wLine.setAttribute("y2", warnY);
      wLine.setAttribute("stroke", "var(--warn)");
      wLine.setAttribute("stroke-width", "1.5");
      wLine.setAttribute("stroke-dasharray", "6 5");
      svg.appendChild(wLine);
      const rLine = document.createElementNS(ns, "line");
      rLine.setAttribute("x1", cx); rLine.setAttribute("x2", cx + cw);
      rLine.setAttribute("y1", retrainY); rLine.setAttribute("y2", retrainY);
      rLine.setAttribute("stroke", "var(--danger)");
      rLine.setAttribute("stroke-width", "1.5");
      rLine.setAttribute("stroke-dasharray", "6 5");
      svg.appendChild(rLine);

      const d = safeRates.map((v, i) => `${i ? "L" : "M"}${mapX(i).toFixed(2)} ${mapY(v).toFixed(2)}`).join(" ");
      const p = document.createElementNS(ns, "path");
      p.setAttribute("d", d);
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", "var(--accent)");
      p.setAttribute("stroke-width", "2.5");
      p.classList.add("animate-path");
      svg.appendChild(p);
      safeRates.forEach((v, i) => {
        addHoverablePoint(svg, mapX(i), mapY(v), "var(--accent)", `Week ${i + 1}: ${v.toFixed(2)}% corrections`);
      });
    }

    function renderThresholdSimulator(metrics) {
      const warnSlider = document.getElementById("warnSlider");
      const blockSlider = document.getElementById("blockSlider");
      const warnVal = document.getElementById("warnVal");
      const blockVal = document.getElementById("blockVal");
      if (!warnSlider || !blockSlider || !warnVal || !blockVal) return;
      const baselineWarn = Math.min(95, Number(runtimePolicy.risk_score_silent_max) + 1);
      const baselineBlock = Math.max(baselineWarn + 1, Number(runtimePolicy.block_threshold));
      warnSlider.value = String(baselineWarn);
      blockSlider.value = String(baselineBlock);
      const update = () => {
        const w = Number(warnSlider.value);
        const b = Number(blockSlider.value);
        if (b <= w) {
          blockSlider.value = String(w + 1);
        }
        warnVal.textContent = String(w);
        blockVal.textContent = String(blockSlider.value);
        const actualBlock = Number(blockSlider.value);
        const curBlock = allEvents.filter((e) => e.score >= baselineBlock).length;
        const curWarn = allEvents.filter((e) => e.score >= baselineWarn && e.score < baselineBlock).length;
        const newBlock = allEvents.filter((e) => e.score >= actualBlock).length;
        const newWarn = allEvents.filter((e) => e.score >= w && e.score < actualBlock).length;
        const newSafe = allEvents.length - newBlock - newWarn;
        const wrongInterventions = allEvents.filter((e) => String(e.feedback).toLowerCase().includes("wrong") && (e.score >= w)).length;
        const fpProxy = newBlock + newWarn ? (wrongInterventions / (newBlock + newWarn)) * 100 : 0;
        const elB = document.getElementById("simBlock");
        const elW = document.getElementById("simWarn");
        const elS = document.getElementById("simSafe");
        const elF = document.getElementById("simFpr");
        if (elB) elB.innerHTML = `Block <strong>${newBlock}</strong> <span class="mini-note">Δ ${newBlock - curBlock}</span>`;
        if (elW) elW.innerHTML = `Warn <strong>${newWarn}</strong> <span class="mini-note">Δ ${newWarn - curWarn}</span>`;
        if (elS) elS.innerHTML = `Safe <strong>${newSafe}</strong> <span class="mini-note">Δ ${newSafe - (allEvents.length - curBlock - curWarn)}</span>`;
        if (elF) elF.innerHTML = `FPR proxy <strong>${fpProxy.toFixed(1)}%</strong>`;
      };
      warnSlider.oninput = update;
      blockSlider.oninput = update;
      update();

      const applyBtn = document.getElementById("applyConfigBtn");
      if (!applyBtn) return;
      applyBtn.onclick = async () => {
        const payload = {
          risk_score_silent_max: Math.max(0, Number(warnSlider.value) - 1),
          warn_threshold: Number(warnSlider.value),
          block_threshold: Number(blockSlider.value),
          note: "Suggested values copied from ML Health Dashboard simulator"
        };
        try {
          await navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
          alert("Copied.");
        } catch {
          alert(JSON.stringify(payload, null, 2));
        }
      };
    }

    function renderFprDonut(metrics) {
      const arc = document.getElementById("fprDonutArc");
      if (!arc) return;
      const fpr = Number(metrics.fpr);
      const circum = 389.6;
      const hasFpr = Number.isFinite(fpr);
      const holdoutVal = Number(metrics.fprHoldout);
      const calibVal = Number(metrics.fprCalibration);
      const holdoutEl = document.getElementById("fprHoldoutVal");
      const calibEl = document.getElementById("fprCalibVal");
      const kindEl = document.getElementById("fprMetricKind");
      const gaugeLabel = document.getElementById("fprGaugeLabel");
      if (holdoutEl) holdoutEl.textContent = Number.isFinite(holdoutVal) ? `${holdoutVal.toFixed(1)}%` : "N/A";
      if (calibEl) calibEl.textContent = Number.isFinite(calibVal) ? `${calibVal.toFixed(1)}%` : "N/A";
      setGauge(arc, hasFpr ? (100 - Math.max(0, Math.min(100, fpr))) : 0, circum);
      document.getElementById("fprDonutText").textContent = hasFpr ? `${fpr.toFixed(1)}%` : "N/A";
      document.getElementById("fprStatVal").textContent = hasFpr ? `${fpr.toFixed(1)}%` : "N/A";
      document.getElementById("fprBlocks").textContent = String(metrics.blocks);
      document.getElementById("fprSnoozed").textContent = String(metrics.snoozed);
      document.getElementById("fprOverride").textContent = `${metrics.overrideRate.toFixed(1)}%`;
      const fprBadge = document.getElementById("fprBadge");
      if (!hasFpr) {
        if (kindEl) kindEl.textContent = "Unavailable";
        if (gaugeLabel) gaugeLabel.textContent = "N/A";
        document.getElementById("fprStatVal").className = "warn";
        document.getElementById("fprTrend").textContent = "labels unavailable - cannot compute true FPR";
        document.getElementById("fprTrend").className = "trend down";
        if (fprBadge) {
          fprBadge.textContent = "Needs feedback labels";
          fprBadge.className = "badge";
        }
      } else if (metrics.fprFromCalibration) {
        if (kindEl) kindEl.textContent = "Calibration FPR";
        if (gaugeLabel) gaugeLabel.textContent = "Calib";
        document.getElementById("fprStatVal").className = fpr > 10 ? "warn" : "ok";
        const holdTxt = Number.isFinite(Number(metrics.fprHoldout))
          ? ` · holdout=${Number(metrics.fprHoldout).toFixed(1)}%`
          : "";
        document.getElementById("fprTrend").textContent = `calibration estimate (not user feedback)${holdTxt}`;
        document.getElementById("fprTrend").className = "trend up";
        if (fprBadge) {
          fprBadge.textContent = "Calib. FPR";
          fprBadge.className = "badge good";
        }
      } else if (metrics.fprSource === "holdout") {
        if (kindEl) kindEl.textContent = "Holdout FPR";
        if (gaugeLabel) gaugeLabel.textContent = "Holdout";
        document.getElementById("fprStatVal").className = fpr > 10 ? "warn" : "ok";
        document.getElementById("fprTrend").textContent = "holdout threshold-check FPR (recall-first can be high)";
        document.getElementById("fprTrend").className = fpr > 10 ? "trend down" : "trend up";
        if (fprBadge) {
          fprBadge.textContent = "Holdout FPR";
          fprBadge.className = "badge";
        }
      } else {
        if (kindEl) kindEl.textContent = metrics.fprSource === "feedback" ? "Feedback FPR" : "FPR";
        if (gaugeLabel) gaugeLabel.textContent = metrics.fprSource === "feedback" ? "Feedback" : "FPR";
        document.getElementById("fprStatVal").className = fpr > 10 ? "warn" : "ok";
        document.getElementById("fprTrend").textContent = fpr > 10 ? "↓ elevated - investigate" : "↑ within safe band";
        document.getElementById("fprTrend").className = fpr > 10 ? "trend down" : "trend up";
        if (fprBadge) {
          fprBadge.textContent = "Target < 5%";
          fprBadge.className = "badge good";
        }
      }
    }

    async function fetchRiskPolicyFull() {
      const candidates = [];
      try {
        candidates.push(new URL("./risk_policy.json", window.location.href).href);
      } catch {
        /* ignore */
      }
      candidates.push(
        "./risk_policy.json",
        "../../core-sentinel-guardrail/config/risk_policy.json",
        "../core-sentinel-guardrail/config/risk_policy.json",
        "/core-sentinel-guardrail/config/risk_policy.json"
      );
      const seen = new Set();
      for (const url of candidates) {
        if (!url || seen.has(url)) continue;
        seen.add(url);
        try {
          const r = await fetch(url, { cache: "no-store" });
          if (!r.ok) continue;
          const pol = await r.json();
          if (pol && typeof pol === "object" && (pol.thresholds || pol.inference_3class_labels)) return pol;
        } catch {
          /* try next */
        }
      }
      return null;
    }

    async function enrichRetrainSummaryFromRiskPolicyFile() {
      if (!retrainSummary) return;
      const needAuc = !Number.isFinite(METRICS_STATIC.auc);
      const hasCalibStr = Boolean(retrainSummary.policy?.inference_3class_labels?._calibration_metrics_val);
      if (!needAuc && hasCalibStr) return;
      try {
        const pol = await fetchRiskPolicyFull();
        if (!pol || typeof pol !== "object") return;
        const nextPolicy = { ...(retrainSummary.policy || {}) };
        if (needAuc && pol.thresholds) {
          const prev = nextPolicy.thresholds || {};
          const merged = { ...prev };
          for (const k of Object.keys(pol.thresholds)) {
            merged[k] = { ...(prev[k] || {}), ...(pol.thresholds[k] || {}) };
          }
          nextPolicy.thresholds = merged;
        }
        if (!hasCalibStr && pol.inference_3class_labels) {
          nextPolicy.inference_3class_labels = {
            ...(nextPolicy.inference_3class_labels || {}),
            ...pol.inference_3class_labels,
          };
        }
        retrainSummary.policy = nextPolicy;
        if (needAuc) applyRetrainSummary(retrainSummary);
      } catch {
        /* ignore */
      }
    }

    async function enrichRetrainSummaryFromCurveFiles() {
      if (!retrainSummary || !retrainSummary.evaluation) {
        if (retrainSummary && !retrainSummary.evaluation) retrainSummary.evaluation = {};
      }
      if (!retrainSummary) return;
      if (getHighPrCurve(retrainSummary)) return;
      const candidates = [
        "../../core-sentinel-guardrail/reports",
        "../core-sentinel-guardrail/reports",
        "/core-sentinel-guardrail/reports",
      ];
      for (const base of candidates) {
        try {
          const r1 = await fetch(`${base}/pr_curve_summary.json`, { cache: "no-store" });
          if (r1.ok) {
            const pr = await r1.json();
            if (pr && typeof pr === "object") retrainSummary.evaluation.pr_curve_summary = pr;
          }
          if (getHighPrCurve(retrainSummary)) break;
        } catch {
          /* try next */
        }
      }
    }

        await enrichRetrainSummaryFromCurveFiles();

        setKpiTarget("aucMetric", METRICS_STATIC.auc);

        drawPRChart();
        drawConfusionMatrix();

            if (isWebsiteRecordsSummary(data)) applyRetrainSummary(data);
          }
        } catch {
          /* ignore */
        }
        try {
          animateCounters();
        } catch {
          /* ignore */
        }
        updateMlSbStatusLine();
      }
    }

      const gate = document.getElementById("mlSbAdminGate");
      const form = document.getElementById("mlSbAdminForm");
      const ok = !!getHubAdminSession();
      if (gate) gate.style.display = ok ? "none" : "block";
      if (form) form.style.display = ok ? "grid" : "none";
      if (ok) {
        fillMlSupabaseAdminInputs();
      }
    }

    function fillMlSupabaseAdminInputs() {
      const urlEl = document.getElementById("mlSbUrl");
      const keyEl = document.getElementById("mlSbKey");
      const meta = document.querySelector('meta[name="core-sentinel-supabase-url"]');
      const metaUrl = meta && meta.content ? meta.content.trim() : "";
      if (urlEl) {
        urlEl.value = (localStorage.getItem("sb_url") || metaUrl || "").trim();
      }
      if (keyEl) {
        keyEl.value = localStorage.getItem("sb_key") || "";
      }
    }

    function initMlSupabasePanel() {
      applyMlSupabasePanelMode();

      const unlockBtn = document.getElementById("mlSbUnlockBtn");
      const keyIn = document.getElementById("mlSbAccessKey");
      const gateErr = document.getElementById("mlSbGateErr");
      if (unlockBtn && keyIn) {
        unlockBtn.addEventListener("click", () => {
          const k = (keyIn.value || "").trim();
          if (k !== HUB_ADMIN_ACCESS_KEY) {
            if (gateErr) gateErr.textContent = "Invalid access key (same as Hub → Admin).";
            return;
          }
          if (gateErr) gateErr.textContent = "";
          keyIn.value = "";
          setHubAdminSessionFromMl();
          applyMlSupabasePanelMode();
          loadDashboard();
        });
      }

      const signOut = document.getElementById("mlSbSignOut");
      if (signOut) {
        signOut.addEventListener("click", () => {
          localStorage.removeItem(HUB_ADMIN_SESSION_KEY);
          applyMlSupabasePanelMode();
          loadDashboard();
        });
      }

      const save = document.getElementById("mlSbSave");
      const urlEl = document.getElementById("mlSbUrl");
      const keyEl = document.getElementById("mlSbKey");
      if (save) {
        save.addEventListener("click", async () => {
          if (!getHubAdminSession()) return;
          const u = (urlEl && urlEl.value || "").trim().replace(/\/$/, "");
          const k = (keyEl && keyEl.value || "").trim();
          if (!u || !k) {
            const st = document.getElementById("mlSbStatus");
            if (st) {
              st.textContent = "Enter both URL and anon key.";
              st.style.color = "var(--warn)";
            }
            return;
          }
          localStorage.setItem("sb_url", u);
          localStorage.setItem("sb_key", k);
          await loadDashboard();
        });
      }
    }

    document.getElementById("exportPdfBtn").addEventListener("click", () => window.print());
    document.getElementById("refreshBtn").addEventListener("click", () => loadDashboard());

    (async function init() {
      initMlSupabasePanel();
      initDensityControl();
      const policyLoad = await loadPolicyThresholds();
      runtimePolicy = policyLoad.policy;
      runtimePolicySource = policyLoad.source;
      applyPolicySourceChip(runtimePolicySource, runtimePolicy);
      await loadDashboard();
      initChartAnimationObserver();
      startAutoRefresh();
      startModelRecordsPolling();
    })();
</script>
</body>
</html>
