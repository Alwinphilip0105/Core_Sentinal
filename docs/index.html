<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Core Sentinel — Docs hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#0d0d1a;color:#e0e0e0;min-height:100vh;display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  padding:24px}
h1{font-size:22px;font-weight:700;color:#fff;margin-bottom:8px}
p{font-size:13px;color:rgba(255,255,255,0.45);margin-bottom:28px;text-align:center;max-width:420px}
nav{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px}
a{display:block;padding:14px 18px;border-radius:10px;text-decoration:none;
  font-size:14px;font-weight:600;border:1px solid rgba(255,255,255,0.1);
  background:#12122a;color:#02C39A;transition:background .15s,border-color .15s}
a:hover{background:#1a1a30;border-color:rgba(2,195,154,0.4)}
a span{display:block;font-size:11px;font-weight:500;color:rgba(255,255,255,0.35);margin-top:4px}
.badge{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,0.25);
  margin-bottom:20px}
</style>
</head>
<body>
  <div class="badge">Core Sentinel</div>
  <h1>Documentation hub</h1>
  <p>Local dashboards and tools. Choose a destination below.</p>
  <nav>
    <a href="dashboard/">Privacy dashboard <span>Embedded JSON · charts &amp; streaks</span></a>
    <a href="admin/">Admin dashboard <span>Supabase fleet analytics</span></a>
    <a href="ml/">ML live dashboard <span>Risk telemetry charts</span></a>
  </nav>
</body>
</html>
