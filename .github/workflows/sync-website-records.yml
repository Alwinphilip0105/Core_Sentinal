# Publishes docs/data/model_records.json from the latest Supabase retrain row.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL                        — project URL (https://….supabase.co)
#   SUPABASE_SERVICE_ROLE_KEY           — preferred (server-side sync)
#   SUPABASE_ANON_KEY                   — optional fallback if RLS allows SELECT on retrain_runs
# Optional:
#   GUARDRAIL_RETRAIN_SUPABASE_TABLE    — default retrain_runs
#
# If URL or any key is missing, the sync step exits 0 with a warning (does not fail CI).
# If the retrain table is empty or unreadable, sync exits 0 with ::warning:: unless
# GUARDRAIL_SYNC_STRICT=1 is set on the job.

name: Sync Website Model Records

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-model-records:
    runs-on: ubuntu-latest
    env:
      # GitHub Actions: use Node 24 for JS-based actions (Node 20 runner removal Sept 2026)
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Sync docs/data/model_records.json from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GUARDRAIL_RETRAIN_SUPABASE_TABLE: ${{ secrets.GUARDRAIL_RETRAIN_SUPABASE_TABLE }}
        run: |
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::warning::SUPABASE_URL is not set. Add repository secret SUPABASE_URL (and a key) to enable sync."
            exit 0
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::warning::No Supabase key: set SUPABASE_SERVICE_ROLE_KEY or SUPABASE_ANON_KEY in repository secrets."
            exit 0
          fi
          python "core-sentinel-guardrail/tools/sync_website_records_from_supabase.py"

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- "docs/data/model_records.json"; then
            echo "No model record changes."
            exit 0
          fi
          git add "docs/data/model_records.json"
          git commit -m "Auto-sync website model records from Supabase"
          git push

